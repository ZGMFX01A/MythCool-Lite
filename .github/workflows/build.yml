name: Build MythCool Lite

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Configure private dependency access
        shell: pwsh
        env:
          CORE_READ_TOKEN: ${{ secrets.DEP }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CORE_READ_TOKEN)) {
            throw "Missing repository secret DEP."
          }
          git config --global url."https://x-access-token:$env:CORE_READ_TOKEN@github.com/".insteadOf "https://github.com/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build -- --no-bundle

      - name: Download FFmpeg runtime
        shell: pwsh
        run: |
          $downloadRoot = Join-Path $env:RUNNER_TEMP "MythCoolLite-ffmpeg"
          $archivePath = Join-Path $downloadRoot "ffmpeg.zip"
          $extractPath = Join-Path $downloadRoot "extracted"
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $ffmpeg = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "FFmpeg executable was not found in the downloaded archive."
          }
          "MYTHCOOL_FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create clean portable package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "artifact"
          $releaseExe = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\desktop.exe"
          $portableDir = Join-Path $env:RUNNER_TEMP "MythCoolLite-Portable"
          $portableZip = Join-Path $outputDir "MythCoolLite-Portable.zip"

          if (-not (Test-Path -LiteralPath $releaseExe)) {
            throw "Release executable was not found: $releaseExe"
          }
          if (-not (Test-Path -LiteralPath $env:MYTHCOOL_FFMPEG_BIN)) {
            throw "FFmpeg runtime directory was not found."
          }

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          if (Test-Path -LiteralPath $portableDir) {
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $portableDir "bin\ffmpeg") -Force | Out-Null

          # 1. 拷贝原生编译的 Release 主程序（原地运行，对 C 盘零污染、零解压）
          Copy-Item -LiteralPath $releaseExe -Destination (Join-Path $portableDir "MythCoolLite.exe") -Force

          # 2. 仅集成推流真正必需的 ffmpeg.exe（精简掉无用的 ffplay 与静态 ffprobe，探测回退由 ffmpeg 自身承担）
          $ffmpegExe = Join-Path $env:MYTHCOOL_FFMPEG_BIN "ffmpeg.exe"
          if (Test-Path -LiteralPath $ffmpegExe) {
            Copy-Item -LiteralPath $ffmpegExe -Destination (Join-Path $portableDir "bin\ffmpeg\ffmpeg.exe") -Force
          } else {
            Copy-Item -Path (Join-Path $env:MYTHCOOL_FFMPEG_BIN "*") -Destination (Join-Path $portableDir "bin\ffmpeg") -Recurse -Force
          }

          # 3. 附带快速启动与防占用脚本
          $cmdLines = @(
            '@echo off',
            'setlocal',
            'set DIR=%~dp0',
            'taskkill /IM MythCool.exe /F >nul 2>&1',
            'taskkill /IM MythCoolLite.exe /F >nul 2>&1',
            'ping -n 2 127.0.0.1 >nul',
            'start "" "%DIR%MythCoolLite.exe" %*',
            'endlocal'
          )
          [IO.File]::WriteAllLines((Join-Path $portableDir "start-portable.cmd"), $cmdLines)

          # 4. 生成绿色说明文档
          $readme = @(
            '============================================================',
            '  Myth.Cool Lite 绿色免安装便携版',
            '============================================================',
            '',
            '1. 纯正绿色便携：解压即可直接使用，对 C 盘零污染、零写入、零解压残留。',
            '2. 双击 MythCoolLite.exe 即可直接启动运行。',
            '3. 如原版 Myth.Cool 占用副屏，可运行 start-portable.cmd 自动释放并启动。',
            '4. 卸载只需直接删除本文件夹，干干净净。',
            '============================================================'
          )
          [IO.File]::WriteAllLines((Join-Path $portableDir "README.txt"), $readme)

          # 5. 压缩为最终便携包 ZIP
          if (Test-Path -LiteralPath $portableZip) {
            Remove-Item -LiteralPath $portableZip -Force
          }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -CompressionLevel Optimal

          $sizeMB = [math]::Round(((Get-Item $portableZip).Length / 1MB), 2)
          Write-Host "Created clean portable package: $portableZip ($sizeMB MB)"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MythCoolLite-Portable
          path: artifact/MythCoolLite-Portable.zip
          if-no-files-found: error

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "artifact\MythCoolLite-Portable.zip" `
            --clobber

